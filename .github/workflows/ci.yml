name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pty-ingress:
    name: PTY ingress / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # This gate recreates issue #2 with a real nonblocking PTY, delayed and
      # split writes, the reader-ready handshake, EOT framing, and no echo. It
      # does not claim that Codex marketplace installation itself was tested.
      - name: Run source PTY ingress regression
        run: node --test tests/pty-ingress.test.mjs

  validate-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / shard ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    # Each file remains independently bounded to ten minutes by the runner.
    # Cleanup-heavy hosted macOS shards have measured near 26 minutes; preserve
    # the complete zero-skip inventory within this fixed bounded budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18.18.2, 22.x]
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate release structure
        if: matrix.shard == 1
        run: node scripts/validate.mjs

      - name: Validate immutable release history
        if: matrix.shard == 1
        run: node scripts/check-release-history.mjs

      - name: Run deterministic zero-skip shard
        # Includes three concurrently accepted structured read jobs, distinct
        # isolated profile paths, terminal cleanup, and bounded exit diagnostics.
        # Installed-host and authenticated-provider tests remain separate
        # qualification boundaries and are not silently counted as skips.
        run: node scripts/test-deterministic.mjs --shard=${{ matrix.shard }}/4

  windows-neutral:
    name: windows-latest / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [18.18.2, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate release structure
        run: node scripts/validate.mjs

      # The fake Grok executable is a POSIX process fixture. Until a genuine
      # shell:false Windows fixture is added, Windows provider behavior remains
      # explicitly unverified rather than being simulated inaccurately.
      - name: Run provider-neutral tests (Windows; provider unverified)
        run: node --test tests/windows-neutral.test.mjs

  # Version tags are accepted only when the checked-out ref is an annotated
  # object on the exact fetched main commit. RC and stable tags also remain
  # fail-closed until protected external qualification attestation exists.
  release-tag:
    name: Release tag required
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete tag and main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify annotated version tag on exact main
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME" --require-ref --main-ref origin/main

  # Hosted GitHub runners do not provide the Codex plugin CLI. Repositories
  # that configure a Codex-equipped runner with these labels and set the
  # CODEX_PLUGIN_RUNNER_ENABLED Actions variable get a clean-profile cache gate
  # only for trusted main pushes or an explicitly dispatched workflow. Never
  # execute pull-request code on the self-hosted runner.
  installed-codex:
    name: Installed Codex snapshot / self-hosted macOS
    if: >-
      ${{ vars.CODEX_PLUGIN_RUNNER_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, macOS, codex-plugin]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Require clean Codex marketplace install and cached PTY execution
        env:
          CODEX_INSTALL_E2E_REQUIRED: "1"
        run: node --test tests/installed-codex.test.mjs

  # This is the boundary the production incidents showed was missing: the real
  # installed Codex skill drives the real Grok CLI, persists a job, records a
  # host-owned check, and proves cleanup. It is opt-in because it uses both
  # authenticated services and must never execute pull-request code.
  natural-codex-grok:
    name: Natural Codex + real Grok / self-hosted macOS
    if: >-
      ${{ vars.CODEX_GROK_NATURAL_E2E_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, macOS, codex-plugin, grok-authenticated]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Point the local marketplace at this checkout
        run: codex plugin marketplace add "$GITHUB_WORKSPACE" --json

      - name: Verify and install the tested plugin snapshot
        run: node scripts/update-local-codex.mjs

      - name: Run natural installed Codex to real Grok qualification
        env:
          CODEX_E2E_MODEL: ${{ vars.CODEX_E2E_MODEL }}
        run: node scripts/test-natural-codex.mjs

  # Stable public branch-protection check. Always runs so a failed hosted job
  # still produces this named result. Self-hosted jobs are intentionally out of
  # scope (skipped on pull requests; not merge gates for fork PRs).
  ci-required:
    name: CI required
    if: always()
    needs: [pty-ingress, validate-and-test, windows-neutral]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require hosted CI job groups
        env:
          PTY_INGRESS_RESULT: ${{ needs['pty-ingress'].result }}
          DETERMINISTIC_RESULT: ${{ needs['validate-and-test'].result }}
          WINDOWS_RESULT: ${{ needs['windows-neutral'].result }}
        run: |
          if [ "$PTY_INGRESS_RESULT" != "success" ] ||
             [ "$DETERMINISTIC_RESULT" != "success" ] ||
             [ "$WINDOWS_RESULT" != "success" ]; then
            exit 1
          fi
