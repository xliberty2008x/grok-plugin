name: Grok Review App worker

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: D1 review request ID
        required: true
        type: string
      installation_id:
        description: GitHub App installation ID
        required: true
        type: string
      repository_id:
        description: Target repository ID
        required: true
        type: string
      pull_number:
        description: Pull request number
        required: true
        type: string
      trigger_kind:
        description: automatic, manual_comment, or check_rerun
        required: true
        type: string
      trigger_id:
        description: Authoritative webhook trigger ID
        required: true
        type: string
      actor_id:
        description: Triggering GitHub user ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Never let an unverified manual/check dispatch cancel another request.
  # Cross-request supersession is authorized and fenced by D1; this group only
  # coalesces ambiguous duplicate dispatches for the same immutable request.
  group: grok-review-request-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact trusted runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.1

      - name: Verify trusted plugin commit
        env:
          TRUSTED_RUNTIME_COMMIT: ${{ vars.GROK_REVIEW_RUNTIME_COMMIT }}
        run: |
          set -euo pipefail
          test -n "${TRUSTED_RUNTIME_COMMIT}"
          test "${GITHUB_SHA}" = "${TRUSTED_RUNTIME_COMMIT}"
          test "$(git rev-parse HEAD)" = "${TRUSTED_RUNTIME_COMMIT}"
          test -z "$(git config --local --get-regexp '^(http\..*\.extraheader|credential\..*)$' || true)"

      # Prototype-only install. Production rollout is gated on replacing this
      # per-run install with a prebuilt, digest-verified runtime bundle.
      - name: Install and attest exact Grok CLI prototype
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          npm install --global --no-audit --no-fund @xai-official/grok@0.2.112
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --input-type=module -e 'import { attestLocalGrok } from "./apps/grok-review-app/src/actions/model-review.mjs"; attestLocalGrok({ expectedVersion: "0.2.112", expectedSha256: "5cf05fe670b1818561daf7566b580a5de6b81149166499d61072e49640b541a4" });'

      - name: Run exact-head Grok App review
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_INSTALLATION_ID: ${{ inputs.installation_id }}
          INPUT_REPOSITORY_ID: ${{ inputs.repository_id }}
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
          INPUT_TRIGGER_KIND: ${{ inputs.trigger_kind }}
          INPUT_TRIGGER_ID: ${{ inputs.trigger_id }}
          INPUT_ACTOR_ID: ${{ inputs.actor_id }}
          GROK_REVIEW_RUNTIME_COMMIT: ${{ vars.GROK_REVIEW_RUNTIME_COMMIT }}
          GROK_REVIEW_RUNTIME_BUNDLE_SHA256: ${{ vars.GROK_REVIEW_RUNTIME_BUNDLE_SHA256 }}
          GROK_REVIEW_NODE_VERSION: 22.17.1
          GROK_CLI_VERSION: ${{ vars.GROK_CLI_VERSION }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_CLIENT_ID: ${{ vars.GITHUB_APP_CLIENT_ID }}
          GROK_REVIEW_WORKER_ORIGIN: ${{ vars.GROK_REVIEW_WORKER_URL }}
          GROK_REVIEW_MODEL: ${{ vars.GROK_MODEL || 'grok-code-fast-1' }}
          GROK_REVIEW_MODEL_VERSION: ${{ vars.GROK_MODEL || 'grok-code-fast-1' }}
          GROK_REVIEW_EFFORT: ${{ vars.GROK_EFFORT || 'high' }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          RUNNER_CALLBACK_SECRET: ${{ secrets.RUNNER_CALLBACK_SECRET }}
          RECEIPT_PRIVATE_KEY: ${{ secrets.RECEIPT_SIGNING_PRIVATE_KEY }}
          RECEIPT_PUBLIC_KEY: ${{ vars.RECEIPT_SIGNING_PUBLIC_KEY }}
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
        run: exec node apps/grok-review-app/src/actions/runner-cli.mjs

      - name: Remove transient review directories
        if: always()
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const roots = new Set([process.env.RUNNER_TEMP, process.env.TMPDIR].filter(Boolean)); for (const root of roots) if (path.isAbsolute(root) && path.parse(root).root !== root && fs.existsSync(root)) for (const name of fs.readdirSync(root)) if (/^(grok-review-model-|grok-review-exact-head-|grok-ci-prompt-)/.test(name)) fs.rmSync(path.join(root, name), { recursive: true, force: true });'
